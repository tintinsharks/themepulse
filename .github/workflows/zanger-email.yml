name: ThemePulse Hourly Zanger Brief

on:
  schedule:
    # Pre-market brief Mon-Fri 12:30 & 13:30 UTC covers 8:30 AM America/New_York
    # across both EDT and EST; the ET window gate (08:20-09:10 ET) filters out
    # the out-of-DST hour automatically.
    - cron: "30 12-13 * * 1-5"
    # Hourly Mon-Fri 14:00-21:00 UTC covers 10:00 AM-4:00 PM America/New_York
    # across both EDT and EST. The scan script enforces the exact ET windows
    # (08:20-09:10 ET & 09:55-16:25 ET) and skips NYSE holidays automatically.
    - cron: "0 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish to Brief page even outside market hours"
        type: boolean
        default: true
      send_email:
        description: "Also send via Gmail (optional; off by default)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zanger-brief
  cancel-in-progress: false

jobs:
  publish-zanger-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve ET trading date
        id: etdate
        run: |
          node -e '
            const fs = require("node:fs");
            const et = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
            const p2 = (n) => String(n).padStart(2, "0");
            const d = `${et.getFullYear()}-${p2(et.getMonth() + 1)}-${p2(et.getDate())}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${d}\n`);
          '

      - name: Restore today's hourly scan state
        uses: actions/cache@v4
        with:
          path: reports/state
          key: zanger-state-${{ steps.etdate.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            zanger-state-${{ steps.etdate.outputs.date }}-

      - name: Run Zanger & Leadership scan and write Brief snapshot
        id: scan
        env:
          TP_PIN: ${{ secrets.TP_PIN }}
          TP_BASE_URL: https://themepulse.vercel.app
        run: |
          mkdir -p reports/email reports/state public/data/briefs
          ARGS="--no-write --brief-out public/data/briefs --email-out reports/email --state-file reports/state/zanger-state.json"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --market-hours-only"
          elif [ "${{ inputs.force_publish }}" = "true" ]; then
            ARGS="$ARGS --force-send"
          fi
          node scripts/zanger-scan.mjs $ARGS > reports/email/stdout.md

          node -e '
            const fs = require("node:fs");
            const meta = JSON.parse(fs.readFileSync("reports/email/meta.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            const skipped = meta.reason === "weekend" || meta.reason === "us_market_holiday" || meta.reason === "outside_market_hours";
            fs.appendFileSync(out, `published=${skipped ? "false" : "true"}\n`);
            fs.appendFileSync(out, `should_send=${meta.shouldSend ? "true" : "false"}\n`);
            fs.appendFileSync(out, `reason=${meta.reason || ""}\n`);
            fs.appendFileSync(out, `et=${meta.et || ""}\n`);
            fs.appendFileSync(out, `subject<<__TP_EOF__\n${meta.subject || "ThemePulse Zanger Scan"}\n__TP_EOF__\n`);
            console.log("Scan meta:", JSON.stringify(meta));
          '

      - name: Commit & push Zanger brief snapshot to Brief page
        if: steps.scan.outputs.published == 'true'
        run: |
          node scripts/sync-stockbee-history.mjs
          node scripts/sync-qqq-breadth-history.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'public/data/briefs/zanger-*.json' 'public/data/stockbee_4pct_history.json' 'public/data/qqq_breadth_history.json'
          if git diff --cached --quiet; then
            echo "No changes to brief snapshots or Stockbee history"
            exit 0
          fi
          git commit -m "Zanger brief — ${{ steps.scan.outputs.et }}"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Optional manual email via Gmail
        if: github.event_name == 'workflow_dispatch' && inputs.send_email == true && steps.scan.outputs.should_send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.scan.outputs.subject }}
          to: ${{ secrets.ALERT_EMAIL || secrets.GMAIL_USER }}
          from: ThemePulse Zanger <${{ secrets.GMAIL_USER }}>
          html_body: file://reports/email/email.html
          body: file://reports/email/email.txt
